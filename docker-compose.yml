services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: process-monitor-collector:1.0.0
    environment:
      DB_PATH: /app/data/monitoring.db
      CORS_ORIGINS: http://localhost:8080
      STALE_AFTER_SECONDS: 90
      OFFLINE_AFTER_SECONDS: 900
      DEFAULT_WINDOW_SECONDS: 3600
      MAX_INGEST_SAMPLES: 500
      MAX_REQUEST_BYTES: 5000000
      RETENTION_DAYS: 30
      APP_VERSION: 1.0.0
    volumes:
      - collector-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    image: nginx:1.27-alpine
    depends_on:
      collector:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  collector-data:
